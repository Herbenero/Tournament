<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hellcastle Olympic Dart Hub</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #ffeb3b;
      --accent-hover: #fbc02d;
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --border: #333333;
      --btn-bg: #2a2a2a;
      --btn-hover: #3a3a3a;
      --success: #4caf50;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 900px; }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { color: var(--accent); font-size: 2.2rem; letter-spacing: 1px; }

    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
    .hidden { display: none !important; }

    label { display: block; margin-bottom: 8px; color: var(--text-muted); font-weight: 600; }
    input, select { width: 100%; padding: 12px; background-color: #2c2c2c; border: 1px solid var(--border); color: var(--text); border-radius: 6px; font-size: 1rem; margin-bottom: 12px; }
    
    .btn { display: inline-block; width: 100%; padding: 12px; background-color: var(--accent); color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; text-align: center; transition: background 0.2s; }
    .btn:hover { background-color: var(--accent-hover); }
    .btn-secondary { background-color: var(--btn-bg); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background-color: var(--btn-hover); }
    .btn-group { display: flex; gap: 10px; margin-top: 10px; }

    /* Player Chips */
    .player-chip-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
    .player-chip { background-color: #2c2c2c; border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .player-chip button { background: none; border: none; color: #ff5252; font-weight: bold; cursor: pointer; font-size: 1.1rem; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid var(--border); padding: 10px; text-align: center; }
    th { background-color: #2a2a2a; color: var(--accent); }
    .rank-1 { color: var(--gold); font-weight: bold; }
    .rank-2 { color: var(--silver); font-weight: bold; }
    .rank-3 { color: var(--bronze); font-weight: bold; }

    /* Game Play Area */
    .game-status { text-align: center; margin-bottom: 20px; font-size: 1.3rem; }
    .active-player { color: var(--accent); font-weight: bold; }
    .score-input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🏰 HELLCASTLE OLYMPIC HUB</h1>
    </header>

    <!-- 1. ROSTER MANAGEMENT -->
    <div id="roster-card" class="card">
      <h2>1. Olympic Roster</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px;">Add all competing players once. Player names will persist across all events!</p>
      
      <div style="display: flex; gap: 10px;">
        <input type="text" id="new-player-name" placeholder="Enter Player Name..." onkeydown="if(event.key==='Enter') addPlayer()" />
        <button class="btn" style="width: 120px;" onclick="addPlayer()">Add</button>
      </div>

      <div id="player-chips" class="player-chip-container"></div>
    </div>

    <!-- 2. EVENT SELECTOR -->
    <div id="event-card" class="card">
      <h2>2. Select Event</h2>
      <br />
      <label for="event-select">Active Event:</label>
      <select id="event-select">
        <option value="count-up">🔢 Count Up (8 Rounds)</option>
        <option value="race-track-1">🏁 Race Track #1 (Segments Only)</option>
        <option value="basketball">🏀 Basketball Darts</option>
        <option value="baseball">⚾ Baseball Darts</option>
        <option value="roman-empire">🏛️ Roman Empire</option>
        <option value="robin-hood">🎯 Robin Hood</option>
        <option value="golf">⛳ Golf Darts</option>
        <option value="shove-a-penny">🪙 Shove a Penny</option>
        <option value="tennis-darts">🎾 Tennis Darts</option>
        <option value="all-fives">5️⃣ All 5's</option>
      </select>

      <button class="btn" onclick="startEvent()">Start Event</button>
    </div>

    <!-- 3. LIVE EVENT ARENA -->
    <div id="arena-card" class="card hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 id="current-event-title">Event Arena</h2>
        <button class="btn btn-secondary" style="width: auto; padding: 6px 12px;" onclick="quitEvent()">Abort Event</button>
      </div>

      <div class="game-status">
        Current Turn: <span id="active-player-display" class="active-player">--</span>
      </div>

      <div id="game-controls">
        <!-- Event-specific inputs rendered dynamically by JS -->
      </div>

      <div id="event-scoreboard">
        <!-- Live event standings rendered dynamically -->
      </div>
    </div>

    <!-- 4. OVERALL OLYMPIC STANDINGS -->
    <div id="standings-card" class="card">
      <h2>Overall Olympic Standings</h2>
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Events Played</th>
            <th>Total Points</th>
          </tr>
        </thead>
        <tbody id="standings-body">
          <tr><td colspan="4" style="color: var(--text-muted);">No players registered yet.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // --- STATE MANAGEMENT ---
    let players = JSON.parse(localStorage.getItem('hellcastle_players')) || ["Player 1", "Player 2"];
    let standings = JSON.parse(localStorage.getItem('hellcastle_standings')) || {};
    let activeGame = null;

    function saveState() {
      localStorage.setItem('hellcastle_players', JSON.stringify(players));
      localStorage.setItem('hellcastle_standings', JSON.stringify(standings));
    }

    // --- ROSTER LOGIC ---
    function renderRoster() {
      const container = document.getElementById("player-chips");
      container.innerHTML = "";
      players.forEach((p, idx) => {
        const chip = document.createElement("div");
        chip.className = "player-chip";
        chip.innerHTML = `${p} <button onclick="removePlayer(${idx})">&times;</button>`;
        container.appendChild(chip);

        if (!standings[p]) standings[p] = { eventsPlayed: 0, totalPoints: 0 };
      });
      renderStandings();
    }

    function addPlayer() {
      const input = document.getElementById("new-player-name");
      const name = input.value.trim();
      if (name && !players.includes(name)) {
        players.push(name);
        if (!standings[name]) standings[name] = { eventsPlayed: 0, totalPoints: 0 };
        input.value = "";
        saveState();
        renderRoster();
      }
    }

    function removePlayer(idx) {
      players.splice(idx, 1);
      saveState();
      renderRoster();
    }

    // --- STANDINGS LOGIC ---
    function renderStandings() {
      const tbody = document.getElementById("standings-body");
      tbody.innerHTML = "";

      const sorted = [...players].sort((a, b) => (standings[b]?.totalPoints || 0) - (standings[a]?.totalPoints || 0));

      if (sorted.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="color: var(--text-muted);">No players registered yet.</td></tr>`;
        return;
      }

      sorted.forEach((p, idx) => {
        const row = document.createElement("tr");
        const rankClass = idx === 0 ? "rank-1" : idx === 1 ? "rank-2" : idx === 2 ? "rank-3" : "";
        row.innerHTML = `
          <td class="${rankClass}">#${idx + 1}</td>
          <td class="${rankClass}">${p}</td>
          <td>${standings[p]?.eventsPlayed || 0}</td>
          <td>${standings[p]?.totalPoints || 0}</td>
        `;
        tbody.appendChild(row);
      });
    }

    // --- EVENT ENGINES ---
    function startEvent() {
      if (players.length === 0) {
        alert("Please add at least one player to the roster first!");
        return;
      }

      const selectedEvent = document.getElementById("event-select").value;
      const eventNames = {
        "count-up": "Count Up",
        "race-track-1": "Race Track #1",
        "basketball": "Basketball Darts"
      };

      document.getElementById("roster-card").classList.add("hidden");
      document.getElementById("event-card").classList.add("hidden");
      document.getElementById("arena-card").classList.remove("hidden");

      document.getElementById("current-event-title").innerText = eventNames[selectedEvent] || "Olympic Event";

      // Initialize Game Engine State
      activeGame = {
        type: selectedEvent,
        currentPlayerIndex: 0,
        round: 1,
        scores: {}
      };

      players.forEach(p => activeGame.scores[p] = 0);
      renderGameControls();
    }

    function renderGameControls() {
      const controls = document.getElementById("game-controls");
      const activePlayer = players[activeGame.currentPlayerIndex];
      document.getElementById("active-player-display").innerText = activePlayer;

      if (activeGame.type === "count-up") {
        controls.innerHTML = `
          <p style="text-align:center; margin-bottom:10px;">Round ${activeGame.round} / 8</p>
          <label>Enter Turn Score (3 Darts Total):</label>
          <input type="number" id="turn-score" placeholder="e.g. 60" autofocus onkeydown="if(event.key==='Enter') submitCountUpTurn()" />
          <button class="btn" onclick="submitCountUpTurn()">Submit Score</button>
        `;
      } else {
        // Generic fallback for other event types
        controls.innerHTML = `
          <label>Enter Event Score for ${activePlayer}:</label>
          <input type="number" id="turn-score" placeholder="Enter Score..." autofocus onkeydown="if(event.key==='Enter') submitGenericTurn()" />
          <button class="btn" onclick="submitGenericTurn()">Submit Turn</button>
        `;
      }

      renderEventScoreboard();
    }

    function submitCountUpTurn() {
      const input = document.getElementById("turn-score");
      const val = parseInt(input.value) || 0;
      const p = players[activeGame.currentPlayerIndex];

      activeGame.scores[p] += val;

      // Next player / round logic
      activeGame.currentPlayerIndex++;
      if (activeGame.currentPlayerIndex >= players.length) {
        activeGame.currentPlayerIndex = 0;
        activeGame.round++;
      }

      if (activeGame.round > 8) {
        finishEvent();
      } else {
        renderGameControls();
      }
    }

    function submitGenericTurn() {
      const input = document.getElementById("turn-score");
      const val = parseInt(input.value) || 0;
      const p = players[activeGame.currentPlayerIndex];

      activeGame.scores[p] += val;

      activeGame.currentPlayerIndex++;
      if (activeGame.currentPlayerIndex >= players.length) {
        finishEvent();
      } else {
        renderGameControls();
      }
    }

    function renderEventScoreboard() {
      const sb = document.getElementById("event-scoreboard");
      let html = `<table><thead><tr><th>Player</th><th>Score</th></tr></thead><tbody>`;
      players.forEach(p => {
        html += `<tr><td>${p}</td><td>${activeGame.scores[p]}</td></tr>`;
      });
      html += `</tbody></table>`;
      sb.innerHTML = html;
    }

    function finishEvent() {
      alert("Event Completed! Updating Olympic Standings...");
      players.forEach(p => {
        standings[p].eventsPlayed += 1;
        standings[p].totalPoints += (activeGame.scores[p] || 0);
      });

      saveState();
      quitEvent();
    }

    function quitEvent() {
      activeGame = null;
      document.getElementById("arena-card").classList.add("hidden");
      document.getElementById("roster-card").classList.remove("hidden");
      document.getElementById("event-card").classList.remove("hidden");
      renderRoster();
    }

    // Initialize Page
    renderRoster();
  </script>
</body>
</html>
