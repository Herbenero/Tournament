<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hellcastle Olympic Hub</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #ffeb3b;
      --text: #ffffff;
      --text-muted: #b0b0b0;
      --border: #333333;
      --btn-bg: #2a2a2a;
      --btn-hover: #3a3a3a;
      --danger: #d32f2f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      color: var(--accent);
      font-size: 2.2rem;
      letter-spacing: 1px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .hidden {
      display: none !important;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-weight: 600;
    }

    select, input {
      width: 100%;
      padding: 12px;
      background-color: #2c2c2c;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-size: 1rem;
      margin-bottom: 15px;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px;
      background-color: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background-color: #fbc02d;
    }

    .btn-secondary {
      background-color: var(--btn-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: var(--btn-hover);
    }

    /* Scoreboard Layout */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #2a2a2a;
      color: var(--accent);
    }

    iframe.game-frame {
      width: 100%;
      height: 700px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #000;
    }

    .flex-row {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎯 HELLCASTLE OLYMPIC HUB</h1>
    </header>

    <!-- 1. EVENT SELECTOR & DASHBOARD -->
    <div id="dashboard-card" class="card">
      <h2>Select Olympic Event</h2>
      <br />
      
      <label for="event-select">Active Event:</label>
      <select id="event-select">
        <option value="roman-empire">🏛️ Roman Empire</option>
        <option value="robin-hood">🎯 Robin Hood</option>
        <option value="race-track-1">🏁 Race Track #1</option>
        <option value="golf">⛳ Golf Darts</option>
        <option value="shove-a-penny">🪙 Shove a Penny</option>
        <option value="tennis-darts">🎾 Tennis Darts</option>
        <option value="all-fives">5️⃣ All 5's</option>
        <option value="basketball">🏀 Basketball Darts</option>
        <option value="count-up">🔢 Count Up</option>
      </select>

      <button class="btn" onclick="launchEvent()">Launch Event</button>
    </div>

    <!-- 2. EXTERNAL EMBED VIEW (ROMAN EMPIRE, ROBIN HOOD, ETC.) -->
    <div id="external-game-card" class="card hidden">
      <div class="flex-row" style="margin-bottom: 15px;">
        <button class="btn btn-secondary" onclick="returnToDashboard()">← Return to Olympic Hub</button>
        <a id="open-external-link" href="#" target="_blank" class="btn btn-secondary" style="width: auto;">Open in New Tab ↗</a>
      </div>
      <iframe id="game-frame" class="game-frame" src=""></iframe>
    </div>

    <!-- 3. HUB STANDINGS TABLE -->
    <div id="standings-card" class="card">
      <h3>Overall Olympic Standings</h3>
      <table>
        <thead>
          <tr id="standings-header-row">
            <th>Metric / Rank</th>
            <!-- Player Names Dynamically Injected Here -->
          </tr>
        </thead>
        <tbody id="standings-body">
          <!-- Standings Injected Here -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Event Configuration Mapping
    const EVENT_CONFIG = {
      "roman-empire": {
        name: "Roman Empire",
        type: "iframe",
        url: "https://herbenero.github.io/Roman-Empire/"
      },
      "robin-hood": {
        name: "Robin Hood",
        type: "iframe",
        url: "https://herbenero.github.io/Robin-Hood/"
      },
      "race-track-1": {
        name: "Race Track #1",
        type: "internal",
        url: "#"
      },
      "golf": {
        name: "Golf Darts",
        type: "internal",
        url: "#"
      },
      "shove-a-penny": {
        name: "Shove a Penny",
        type: "internal",
        url: "#"
      },
      "tennis-darts": {
        name: "Tennis Darts",
        type: "internal",
        url: "#"
      },
      "all-fives": {
        name: "All 5's",
        type: "internal",
        url: "#"
      },
      "basketball": {
        name: "Basketball Darts",
        type: "internal",
        url: "#"
      },
      "count-up": {
        name: "Count Up",
        type: "internal",
        url: "#"
      }
    };

    function launchEvent() {
      const selectedKey = document.getElementById("event-select").value;
      const eventData = EVENT_CONFIG[selectedKey];

      if (!eventData) return;

      if (eventData.type === "iframe") {
        document.getElementById("dashboard-card").classList.add("hidden");
        document.getElementById("standings-card").classList.add("hidden");
        
        const frame = document.getElementById("game-frame");
        const externalLink = document.getElementById("open-external-link");
        
        frame.src = eventData.url;
        externalLink.href = eventData.url;
        
        document.getElementById("external-game-card").classList.remove("hidden");
      } else {
        alert("Launching local event: " + eventData.name);
      }
    }

    function returnToDashboard() {
      const frame = document.getElementById("game-frame");
      frame.src = "";
      
      document.getElementById("external-game-card").classList.add("hidden");
      document.getElementById("dashboard-card").classList.remove("hidden");
      document.getElementById("standings-card").classList.remove("hidden");
    }
  </script>
</body>
</html>
